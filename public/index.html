<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=yes">
    <title>GOD · X Image2Link · Advanced</title>
    <!-- Tailwind for rapid responsive design -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Font Awesome for icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    <style>
        /* Custom neon & glitch effects */
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;700;900&display=swap');
        * {
            font-family: 'Inter', sans-serif;
        }
        body {
            background: #0b0c10;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 0;
            padding: 1rem;
        }
        .glitch-text {
            position: relative;
            animation: glitch 3s infinite;
        }
        @keyframes glitch {
            0%, 100% { text-shadow: 0 0 5px #0ff, 0 0 10px #0ff; }
            25% { text-shadow: -2px 0 #ff00ff, 2px 0 #00ffff; }
            50% { text-shadow: 2px -1px #ff00ff, -2px 1px #00ffff; }
            75% { text-shadow: 1px 2px #ff00ff, -1px -2px #00ffff; }
        }
        .neon-box {
            box-shadow: 0 0 10px #00ffff, 0 0 20px #00ffff88;
            transition: box-shadow 0.3s;
        }
        .neon-box:hover {
            box-shadow: 0 0 20px #00ffff, 0 0 40px #00ffff;
        }
        .dropzone-active {
            border-color: #00ffff !important;
            background: rgba(0,255,255,0.1) !important;
            transform: scale(1.02);
        }
        .loading-overlay {
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.9);
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 9999;
            backdrop-filter: blur(5px);
            transition: opacity 0.3s;
        }
        .loading-spinner {
            width: 60px;
            height: 60px;
            border: 5px solid #00ffff22;
            border-top: 5px solid #00ffff;
            border-radius: 50%;
            animation: spin 1s linear infinite;
        }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
        .glitch-bg {
            background: linear-gradient(45deg, #0f0f1f, #1a1a2e);
            position: relative;
            overflow: hidden;
        }
        .glitch-bg::before {
            content: '';
            position: absolute;
            top: -10px; left: -10px; right: -10px; bottom: -10px;
            background: inherit;
            filter: blur(10px) brightness(1.2);
            z-index: -1;
            opacity: 0.3;
            animation: glitch-bg 5s infinite alternate;
        }
        @keyframes glitch-bg {
            0% { transform: translate(0,0) scale(1); }
            20% { transform: translate(-1%,-1%) scale(1.02); }
            40% { transform: translate(1%,1%) scale(0.98); }
            60% { transform: translate(-2%,1%) scale(1.01); }
            80% { transform: translate(2%,-1%) scale(0.99); }
            100% { transform: translate(0,0) scale(1); }
        }
        .limit-message {
            background: #ff0044;
            color: white;
            padding: 1rem;
            border-radius: 0.5rem;
            text-align: center;
            font-weight: bold;
            animation: pulse 2s infinite;
        }
        @keyframes pulse {
            0% { opacity: 0.8; transform: scale(1); }
            50% { opacity: 1; transform: scale(1.02); }
            100% { opacity: 0.8; transform: scale(1); }
        }
        /* responsive tweaks */
        @media (max-width: 640px) {
            h1 { font-size: 2.5rem; }
            .container { padding: 1rem; }
        }
    </style>
</head>
<body class="glitch-bg">
    <!-- Loading Overlay (hidden by default) -->
    <div id="loadingOverlay" class="loading-overlay" style="display: none;">
        <div class="text-center">
            <div class="loading-spinner mx-auto mb-4"></div>
            <p class="text-cyan-400 text-xl glitch-text">UPLOADING ... SECURING LINK</p>
            <p class="text-gray-400 text-sm mt-2">please wait, raw GitHub magic</p>
        </div>
    </div>

    <!-- Main Card -->
    <div class="relative w-full max-w-3xl bg-gray-900/90 backdrop-blur-sm rounded-3xl p-6 md:p-8 border border-cyan-500/50 neon-box">
        <!-- Header with glitch -->
        <div class="text-center mb-8">
            <h1 class="text-5xl md:text-6xl font-black tracking-wider glitch-text">
                <span class="text-cyan-400">GOD</span>
                <span class="text-white"> · X</span>
            </h1>
            <p class="text-xl text-cyan-300/70 mt-2">Image2Link <span class="text-pink-400">⚡ advanced</span></p>
            <div class="w-24 h-1 bg-cyan-400 mx-auto mt-4 rounded-full"></div>
        </div>

        <!-- Upload Counter / Limit Display -->
        <div id="counterBox" class="flex justify-between items-center bg-gray-800/80 rounded-xl p-4 mb-6 border border-cyan-500/30">
            <span class="text-gray-300"><i class="fas fa-cloud-upload-alt text-cyan-400 mr-2"></i>Your uploads today</span>
            <span id="uploadCountDisplay" class="text-2xl font-bold text-cyan-400">0</span>
            <span class="text-gray-400">/10</span>
        </div>

        <!-- Error / Limit Message Area -->
        <div id="limitMessage" class="limit-message hidden mb-4">
            <i class="fas fa-exclamation-triangle mr-2"></i> <span id="limitText"></span>
        </div>

        <!-- Drop Zone -->
        <div id="dropzone" class="border-2 border-dashed border-cyan-500/50 rounded-xl p-6 md:p-8 text-center cursor-pointer transition-all duration-300 hover:border-cyan-400 hover:bg-cyan-950/30">
            <input type="file" id="fileInput" accept="image/*" class="hidden">
            <div class="flex flex-col items-center gap-3">
                <i class="fas fa-image text-5xl text-cyan-400/70"></i>
                <p class="text-lg text-gray-200">Drag & drop an image or <span class="text-cyan-400 underline">browse</span></p>
                <p class="text-sm text-gray-400">JPG, PNG, GIF, WebP · max 10MB</p>
            </div>
        </div>

        <!-- Preview Area (hidden initially) -->
        <div id="previewArea" class="mt-6 hidden">
            <div class="relative rounded-xl overflow-hidden border border-cyan-500/30 bg-black/50 p-2">
                <img id="preview" class="max-h-64 mx-auto object-contain rounded-lg" src="" alt="preview">
                <button id="removePreview" class="absolute top-4 right-4 bg-red-600/80 hover:bg-red-600 text-white rounded-full w-8 h-8 flex items-center justify-center">
                    <i class="fas fa-times"></i>
                </button>
            </div>
        </div>

        <!-- Status Message (inline) -->
        <div id="status" class="mt-4 text-center text-sm text-gray-300 min-h-[2rem]"></div>

        <!-- Upload Button -->
        <button id="uploadBtn" class="mt-4 w-full bg-cyan-600 hover:bg-cyan-500 text-white font-bold py-4 px-6 rounded-xl transition-all disabled:opacity-50 disabled:cursor-not-allowed flex items-center justify-center gap-3 text-lg">
            <i class="fas fa-upload"></i> <span>Upload to GitHub</span>
        </button>

        <!-- Reupload Button (appears after success) -->
        <button id="reuploadBtn" class="mt-3 w-full bg-gray-700 hover:bg-gray-600 text-white font-bold py-3 px-6 rounded-xl transition-all hidden items-center justify-center gap-3">
            <i class="fas fa-redo-alt"></i> <span>Upload New Image</span>
        </button>

        <!-- Result Box (hidden initially) -->
        <div id="result" class="mt-6 hidden">
            <div class="bg-gray-800/90 rounded-xl p-4 border border-cyan-500/50">
                <p class="text-sm text-cyan-300 mb-2 flex items-center"><i class="fas fa-link mr-2"></i>Raw GitHub Link</p>
                <div class="flex flex-col sm:flex-row gap-2">
                    <input id="linkInput" type="text" readonly class="flex-1 bg-gray-900 text-cyan-200 px-4 py-3 rounded-lg border border-cyan-500/30 outline-none" value="">
                    <button id="copyBtn" class="bg-cyan-700 hover:bg-cyan-600 px-5 py-3 rounded-lg font-mono text-sm transition flex items-center justify-center gap-2">
                        <i class="fas fa-copy"></i> Copy
                    </button>
                </div>
            </div>
        </div>

        <!-- Footer -->
        <p class="text-center text-xs text-gray-500 mt-8">
            <i class="fas fa-shield-alt text-cyan-400 mr-1"></i> device-limited (10 uploads) · hosted on Vercel
        </p>
    </div>

    <script>
        (function() {
            // ----- DOM elements -----
            const dropzone = document.getElementById('dropzone');
            const fileInput = document.getElementById('fileInput');
            const previewArea = document.getElementById('previewArea');
            const preview = document.getElementById('preview');
            const removePreview = document.getElementById('removePreview');
            const statusDiv = document.getElementById('status');
            const uploadBtn = document.getElementById('uploadBtn');
            const reuploadBtn = document.getElementById('reuploadBtn');
            const resultDiv = document.getElementById('result');
            const linkInput = document.getElementById('linkInput');
            const copyBtn = document.getElementById('copyBtn');
            const loadingOverlay = document.getElementById('loadingOverlay');
            const uploadCountDisplay = document.getElementById('uploadCountDisplay');
            const limitMessage = document.getElementById('limitMessage');
            const limitText = document.getElementById('limitText');

            // ----- State -----
            let selectedFile = null;
            let uploadCount = 0;

            // ----- Load upload count from localStorage -----
            function loadCount() {
                const stored = localStorage.getItem('godx_upload_count');
                uploadCount = stored ? parseInt(stored, 10) : 0;
                uploadCountDisplay.textContent = uploadCount;
                // If limit reached, disable UI
                if (uploadCount >= 10) {
                    disableUpload(true, 'You have reached the maximum 10 uploads from this device.');
                } else {
                    enableUpload();
                }
            }

            // ----- Save count -----
            function saveCount() {
                localStorage.setItem('godx_upload_count', uploadCount);
                uploadCountDisplay.textContent = uploadCount;
                if (uploadCount >= 10) {
                    disableUpload(true, 'Maximum 10 uploads reached. Please use another device.');
                } else {
                    enableUpload();
                }
            }

            // ----- Increment count (call after successful upload) -----
            function incrementCount() {
                if (uploadCount < 10) {
                    uploadCount++;
                    saveCount();
                }
            }

            // ----- Disable upload UI (limit reached) -----
            function disableUpload(showMessage = true, msg = '') {
                uploadBtn.disabled = true;
                dropzone.style.pointerEvents = 'none';
                dropzone.style.opacity = '0.5';
                fileInput.disabled = true;
                if (showMessage && msg) {
                    limitText.textContent = msg;
                    limitMessage.classList.remove('hidden');
                } else {
                    limitMessage.classList.add('hidden');
                }
            }

            // ----- Enable upload UI (under limit) -----
            function enableUpload() {
                uploadBtn.disabled = false;
                dropzone.style.pointerEvents = 'auto';
                dropzone.style.opacity = '1';
                fileInput.disabled = false;
                limitMessage.classList.add('hidden');
            }

            // ----- Reset to fresh state (after upload or reupload) -----
            function resetToFresh() {
                selectedFile = null;
                fileInput.value = '';
                previewArea.classList.add('hidden');
                preview.src = '';
                statusDiv.innerHTML = '';
                resultDiv.classList.add('hidden');
                reuploadBtn.classList.add('hidden');
                uploadBtn.disabled = (uploadCount >= 10);
            }

            // ----- Show status message -----
            function showStatus(msg, isError = false) {
                statusDiv.innerHTML = msg;
                statusDiv.style.color = isError ? '#f87171' : '#4ade80';
            }

            // ----- Handle file selection -----
            function handleFile(file) {
                // Validate type
                if (!file.type.startsWith('image/')) {
                    showStatus('❌ Please select an image file.', true);
                    return;
                }
                // Validate size (10MB)
                if (file.size > 10 * 1024 * 1024) {
                    showStatus('❌ File too large (max 10MB).', true);
                    return;
                }
                selectedFile = file;
                // Preview
                const reader = new FileReader();
                reader.onload = (e) => {
                    preview.src = e.target.result;
                    previewArea.classList.remove('hidden');
                };
                reader.readAsDataURL(file);
                showStatus(`✅ Selected: ${file.name}`, false);
            }

            // ----- Event listeners for drag & drop, click -----
            dropzone.addEventListener('click', () => fileInput.click());

            dropzone.addEventListener('dragover', (e) => {
                e.preventDefault();
                dropzone.classList.add('dropzone-active');
            });
            dropzone.addEventListener('dragleave', () => {
                dropzone.classList.remove('dropzone-active');
            });
            dropzone.addEventListener('drop', (e) => {
                e.preventDefault();
                dropzone.classList.remove('dropzone-active');
                const file = e.dataTransfer.files[0];
                if (file) handleFile(file);
            });

            fileInput.addEventListener('change', (e) => {
                const file = e.target.files[0];
                if (file) handleFile(file);
            });

            // Remove preview
            removePreview.addEventListener('click', () => {
                resetToFresh();
            });

            // ----- Upload logic -----
            uploadBtn.addEventListener('click', async () => {
                if (!selectedFile) {
                    showStatus('❌ No image selected.', true);
                    return;
                }
                if (uploadCount >= 10) {
                    disableUpload(true, 'Upload limit reached.');
                    return;
                }

                // Show loading overlay
                loadingOverlay.style.display = 'flex';
                showStatus('⏳ Uploading to GitHub...', false);

                // Convert to base64
                const reader = new FileReader();
                reader.onload = async (e) => {
                    const base64 = e.target.result.split(',')[1];

                    try {
                        const response = await fetch('/api/upload', {
                            method: 'POST',
                            headers: { 'Content-Type': 'application/json' },
                            body: JSON.stringify({
                                filename: selectedFile.name,
                                content: base64
                            })
                        });

                        const data = await response.json();

                        if (response.ok) {
                            // Success
                            incrementCount(); // increase count (max 10)
                            showStatus('✅ Upload successful!', false);
                            linkInput.value = data.url;
                            resultDiv.classList.remove('hidden');
                            reuploadBtn.classList.remove('hidden');
                            uploadBtn.disabled = true; // disable upload until reupload
                        } else {
                            showStatus(`❌ Error: ${data.error || 'Unknown'}`, true);
                        }
                    } catch (err) {
                        showStatus(`❌ Network error: ${err.message}`, true);
                    } finally {
                        loadingOverlay.style.display = 'none';
                    }
                };
                reader.readAsDataURL(selectedFile);
            });

            // Reupload button: reset form
            reuploadBtn.addEventListener('click', () => {
                resetToFresh();
            });

            // Copy button
            copyBtn.addEventListener('click', async () => {
                try {
                    await navigator.clipboard.writeText(linkInput.value);
                    copyBtn.innerHTML = '<i class="fas fa-check"></i> Copied!';
                    setTimeout(() => {
                        copyBtn.innerHTML = '<i class="fas fa-copy"></i> Copy';
                    }, 2000);
                } catch (err) {
                    alert('Copy failed, select manually.');
                }
            });

            // Initial load
            loadCount();

            // If limit already reached on start, show message
            if (uploadCount >= 10) {
                disableUpload(true, 'Maximum uploads (10) used on this device.');
            }

            // Extra: prevent multiple uploads if limit reached by re-check before upload
            // (already checked in upload click)
        })();
    </script>
</body>
</html>
